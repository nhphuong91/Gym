<svg width="100%" viewBox="0 0 680 1556" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">

<text font-size="15" font-weight="500" fill="#1a1a1a" x="340" y="28" text-anchor="middle">Lower body strength + endurance — Session A</text>
<text font-size="11" fill="#666" x="340" y="44" text-anchor="middle">Focus block · 10 targets · hip, knee, ankle, spine at loading stage 1 · shoulder 2 · ~30 min · 12 working sets</text>

<!-- LEGEND -->
<rect x="30" y="54" width="620" height="56" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#1a1a1a" x="50" y="72">Muscle group</text>
<rect x="50" y="89" width="10" height="10" rx="2" fill="#26215c"/>
<text font-size="11" fill="#333" x="66" y="98">Quads</text>
<rect x="109" y="89" width="10" height="10" rx="2" fill="#633806"/>
<text font-size="11" fill="#333" x="125" y="98">Hamstrings</text>
<rect x="196" y="89" width="10" height="10" rx="2" fill="#185fa5"/>
<text font-size="11" fill="#333" x="212" y="98">Calves</text>
<rect x="261" y="89" width="10" height="10" rx="2" fill="#085041"/>
<text font-size="11" fill="#333" x="277" y="98">Hips</text>
<rect x="315" y="89" width="10" height="10" rx="2" fill="#444441"/>
<text font-size="11" fill="#333" x="331" y="98">Shin, ankle &amp; popliteus</text>

<!-- PRE-WORKOUT NOTE -->
<rect x="30" y="122" width="620" height="75" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="139">Before: lower mobility routine, pre half · then light warm-up sets before each strength lift</text>
<text font-size="11" fill="#2272a8" x="50" y="152">Outside the exercise time (R19) · strength load: ≈60% in weeks 1–2, ≈80% in weeks 3–4, 100% from week 5 (R22)</text>
<text font-size="11" fill="#2272a8" x="50" y="165">100% = the load that leaves 3 in reserve after 3 reps: reach it from below from week 5, no maximum test (R16)</text>
<text font-size="11" fill="#2272a8" x="50" y="178">Guide: ≈60% is a load you could lift 20+ times, ≈80% about 12–15 times · week 1 = your first session</text>
<text font-size="11" fill="#2272a8" x="50" y="191">Endurance: a band or position you could work 15–18 times — 12–15 reps with 3 in reserve (Stage 0 §2.2)</text>

<!-- ── A STRAIGHT SETS ── -->
<rect x="30" y="209" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="225">A — Straight sets: Quads  (strength · ~8.5 min · 2 sets · 2–4 min rest after each)</text>

<!-- A1 — Smith squat -->
<rect x="30" y="243" width="8" height="70" rx="2" fill="#26215c"/>
<rect x="38" y="243" width="612" height="70" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="259">1</text>
<text font-size="12" font-weight="500" fill="#26215c" x="72" y="259">Smith squat, above parallel</text>
<text font-size="11" fill="#3c3489" x="72" y="274">Quads (M) · glutes assist</text>
<text font-size="11" fill="#3c3489" x="72" y="289">Bar on the upper back, wrists straight · soft knee at the top, no lockout</text>
<text font-size="11" fill="#3c3489" x="72" y="303">Safeties at the depth cap: the thighs stay above parallel</text>
<text font-size="12" font-weight="500" fill="#26215c" x="490" y="259">2 × 3</text>
<text font-size="11" fill="#3c3489" x="490" y="274">3 RIR · every week</text>
<text font-size="11" fill="#3c3489" x="490" y="288">Smith · safeties</text>

<!-- ── B STRAIGHT SETS ── -->
<rect x="30" y="327" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="343">B — Straight sets: Hamstrings  (strength · ~8.5 min · 2 sets · 2–4 min rest after each)</text>

<!-- B2 — Smith RDL -->
<rect x="30" y="361" width="8" height="70" rx="2" fill="#633806"/>
<rect x="38" y="361" width="612" height="70" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="377">2</text>
<text font-size="12" font-weight="500" fill="#412402" x="72" y="377">Smith Romanian deadlift</text>
<text font-size="11" fill="#633806" x="72" y="392">Hamstrings (L) · glutes and erectors assist</text>
<text font-size="11" fill="#633806" x="72" y="407">Bar close along the thighs · spine neutral · soft knees and elbows</text>
<text font-size="11" fill="#633806" x="72" y="421">Safeties near mid-shin, at ~70–80% of your range: the bar stops there</text>
<text font-size="12" font-weight="500" fill="#412402" x="490" y="377">2 × 3</text>
<text font-size="11" fill="#633806" x="490" y="392">3 RIR · every week</text>
<text font-size="11" fill="#633806" x="490" y="406">Smith · safeties</text>

<!-- ── C SUPERSET 1 ── -->
<rect x="30" y="445" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="461">C — Superset 1: Calves + Hip abductors  (strength · ~9 min · 2 rounds · 2–4 min rest)</text>

<!-- C3 — Smith calf raise -->
<rect x="30" y="479" width="8" height="70" rx="2" fill="#185fa5"/>
<rect x="38" y="479" width="612" height="70" rx="4" fill="#e6f1fb" stroke="#378add" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="495">3</text>
<text font-size="12" font-weight="500" fill="#042c53" x="72" y="495">Smith standing calf raise</text>
<text font-size="11" fill="#185fa5" x="72" y="510">Calves (L) · bar on the upper back · soft knees</text>
<text font-size="11" fill="#185fa5" x="72" y="525">Optional 3–5 cm heel drop, pause at the bottom · stop short of full height</text>
<text font-size="11" fill="#185fa5" x="72" y="539">Safeties just under the lowest bar position</text>
<text font-size="12" font-weight="500" fill="#042c53" x="490" y="495">2 × 3</text>
<text font-size="11" fill="#185fa5" x="490" y="510">3 RIR · every week</text>
<text font-size="11" fill="#185fa5" x="490" y="524">Smith · optional low step</text>

<text font-size="12" fill="#888" x="340" y="563" text-anchor="middle">↕ then immediately</text>

<!-- C4 — Hip abduction machine -->
<rect x="30" y="573" width="8" height="54" rx="2" fill="#085041"/>
<rect x="38" y="573" width="612" height="54" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="589">4</text>
<text font-size="12" font-weight="500" fill="#085041" x="72" y="589">Hip abduction machine</text>
<text font-size="11" fill="#0f6e56" x="72" y="604">Hip abductors (M) · seated · pads on the thighs above the knees</text>
<text font-size="11" fill="#0f6e56" x="72" y="619">Open to ~70–80% of your range, never end range · both legs together</text>
<text font-size="12" font-weight="500" fill="#085041" x="490" y="589">2 × 3</text>
<text font-size="11" fill="#0f6e56" x="490" y="604">3 RIR · every week</text>
<text font-size="11" fill="#0f6e56" x="490" y="618">Hip machine</text>

<!-- ── D SUPERSET 2 ── -->
<rect x="30" y="641" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="657">D — Superset 2: Evertors + Popliteus  (endurance · ~4.5 min · 2 rounds · ≤30 s rest)</text>

<!-- D5 — Band ankle eversion -->
<rect x="30" y="675" width="8" height="54" rx="2" fill="#444441"/>
<rect x="38" y="675" width="612" height="54" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="691">5</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="72" y="691">Band ankle eversion, both feet</text>
<text font-size="11" fill="#5f5e5a" x="72" y="706">Evertors (S) · seated · one band round both forefeet</text>
<text font-size="11" fill="#5f5e5a" x="72" y="721">Turn both soles out to ~70–80% of your range · both feet together</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="490" y="691">2 × 12–15</text>
<text font-size="11" fill="#5f5e5a" x="490" y="706">3 RIR · every week</text>
<text font-size="11" fill="#5f5e5a" x="490" y="720">Band</text>

<text font-size="12" fill="#888" x="340" y="743" text-anchor="middle">↕ then immediately</text>

<!-- D6 — Popliteus band IR -->
<rect x="30" y="753" width="8" height="70" rx="2" fill="#444441"/>
<rect x="38" y="753" width="612" height="70" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="769">6</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="72" y="769">Popliteus banded internal rotation, both legs</text>
<text font-size="11" fill="#5f5e5a" x="72" y="784">Popliteus (S) · sit, knees soft-bent 20–40° over the foam roller</text>
<text font-size="11" fill="#5f5e5a" x="72" y="799">A long band round each forefoot, anchored low on that side</text>
<text font-size="11" fill="#5f5e5a" x="72" y="813">Turn both shins in together, thighs still · ~70–80% of your range</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="490" y="769">2 × 12–15</text>
<text font-size="11" fill="#5f5e5a" x="490" y="784">3 RIR · every week</text>
<text font-size="11" fill="#5f5e5a" x="490" y="798">2 long bands · frame · roller</text>

<!-- POST-WORKOUT NOTE -->
<rect x="30" y="835" width="620" height="36" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="852">After: lower mobility routine, post half</text>
<text font-size="11" fill="#2272a8" x="50" y="865">Next day, train only if that morning's step gate passes for every joint both sessions load (R20)</text>

<!-- GLOBAL RULES -->
<rect x="30" y="883" width="620" height="232" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="905">Every rep, every set — hypermobility rules</text>
<rect x="50" y="915" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="923">Lower every rep over 2–3 s; keep a soft bend at every joint, no lockout (R25 · R2)</text>
<rect x="50" y="935" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="943">Work to ~70–80% of your range, never end range; the safeties end squat and hinge depth (R1 · R3 · R11)</text>
<rect x="50" y="955" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="963">Skip the session if joints feel loose; end a set the moment a joint feels unstable (R9)</text>
<rect x="50" y="975" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="983">Strength: 3 reps with 3 in reserve, every week — from week 5 a load you could lift 6 times (R17 · R22)</text>
<rect x="50" y="995" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1003">Strength rest: 2–4 min after each set or pair, as the next set needs (Stage 0 §2.2)</text>
<rect x="50" y="1015" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1023">Endurance: 12–15 reps with 3 in reserve, every week; rest ≤30 s after each pair (R17)</text>
<rect x="50" y="1035" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1043">Both legs together on every exercise: one-leg work waits for loading stage 3 (R12)</text>
<rect x="50" y="1055" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1063">Progress strength from week 5: 3 reps leave over 3 in reserve, twice running → smallest load step (R42)</text>
<rect x="50" y="1075" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1083">Progress endurance: 15 reps twice running → a harder band or position, reps back to 12 (R42)</text>
<rect x="50" y="1095" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1103">Log the step gate after each session; a fail repeats last week's dose for that joint (§2.6 · R43)</text>

<!-- TIMING SUMMARY -->
<rect x="30" y="1127" width="620" height="67" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="1147">Session timeline</text>
<text font-size="11" fill="#2272a8" x="50" y="1164">Mobility pre half → warm-up sets → A → B → C → D → mobility post half</text>
<text font-size="11" fill="#2272a8" x="50" y="1181">Exercise time ≈30 min (R40: 4 s a rep, top of every range, 4 min or 30 s rest by goal) · 12 working sets</text>

<!-- SET COUNT -->
<rect x="30" y="1206" width="620" height="164" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="1228">Working sets — here · week (direct + half-sets from compounds)</text>
<text font-size="11" fill="#1a1a1a" x="50" y="1248">Strength · 4 a target (R34)</text>
<text font-size="11" fill="#26215c" x="50" y="1266">Quads 2 · week 4</text>
<text font-size="11" fill="#633806" x="50" y="1284">Hamstrings 2 · week 4</text>
<text font-size="11" fill="#185fa5" x="50" y="1302">Calves 2 · week 4</text>
<text font-size="11" fill="#085041" x="50" y="1320">Hip abductors 2 · week 4</text>
<text font-size="11" fill="#085041" x="50" y="1338">Adductors 0 · week 4</text>
<text font-size="11" fill="#085041" x="50" y="1356">Glutes 0 · week 0 + 4.0 from the squat and RDL (R36)</text>
<text font-size="11" fill="#1a1a1a" x="360" y="1248">Endurance · 4 a target (R34)</text>
<text font-size="11" fill="#444441" x="360" y="1266">Evertors 2 · week 4</text>
<text font-size="11" fill="#444441" x="360" y="1284">Popliteus 2 · week 4</text>
<text font-size="11" fill="#444441" x="360" y="1302">Tibialis 0 · week 4</text>
<text font-size="11" fill="#085041" x="360" y="1320">Hip flexors 0 · week 4</text>

<!-- ALTERNATIVES TABLE -->
<rect x="30" y="1382" width="620" height="122" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="1402">Alternatives — if a station is taken (R41) · ⚠ R30: cannot reach a strength load</text>
<line x1="40" y1="1411" x2="640" y2="1411" stroke="#ccc" stroke-width="0.5"/>
<text font-size="10" font-weight="500" fill="#666" x="50" y="1424">#  Primary exercise</text>
<text font-size="10" font-weight="500" fill="#666" x="280" y="1424">Alternative 1</text>
<text font-size="10" font-weight="500" fill="#666" x="470" y="1424">Alternative 2</text>
<line x1="40" y1="1429" x2="640" y2="1429" stroke="#ccc" stroke-width="0.5"/>
<text font-size="10" fill="#26215c" x="50" y="1444">1  Smith squat</text>
<text font-size="10" fill="#444" x="280" y="1444">Barbell squat to rack pins</text>
<text font-size="10" fill="#444" x="470" y="1444">Goblet squat, above parallel ⚠ R30</text>

<text font-size="10" fill="#633806" x="50" y="1460">2  Smith Romanian deadlift</text>
<text font-size="10" fill="#444" x="280" y="1460">Barbell RDL to rack pins</text>
<text font-size="10" fill="#444" x="470" y="1460">Dumbbell RDL ⚠ R30</text>

<text font-size="10" fill="#185fa5" x="50" y="1476">3  Smith standing calf raise</text>
<text font-size="10" fill="#444" x="280" y="1476">Deficit calf raise, step edge ⚠ R30</text>
<text font-size="10" fill="#444" x="470" y="1476">Standing calf raise, DBs ⚠ R30</text>

<text font-size="10" fill="#085041" x="50" y="1492">4  Hip abduction machine</text>
<text font-size="10" fill="#444" x="280" y="1492">Supine banded butterfly ⚠ R30</text>
<text font-size="10" fill="#444" x="470" y="1492">none: the others need stage 3</text>

<!-- VERSION NOTE -->
<text font-size="9" fill="#aaa" x="340" y="1524" text-anchor="middle">v7 — each lift in 2 of the 3 sessions (Stage 0 D-99): squat, RDL, calf ↔ hip abduction, eversion ↔ popliteus (catalogue rev 28)</text>

