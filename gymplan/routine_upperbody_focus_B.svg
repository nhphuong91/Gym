<text font-size="15" font-weight="500" fill="#1a1a1a" x="340" y="28" text-anchor="middle">Upper body hypertrophy — Session B</text>
<text font-size="11" fill="#666" x="340" y="44" text-anchor="middle">Focus block · 9 targets · upper joints at loading stage 2 · ~38.5 min · 24 working sets</text>

<!-- LEGEND -->
<rect x="30" y="54" width="620" height="56" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#1a1a1a" x="50" y="72">Muscle group</text>
<rect x="50" y="89" width="10" height="10" rx="2" fill="#26215c"/>
<text font-size="11" fill="#333" x="66" y="98">Chest</text>
<rect x="109" y="89" width="10" height="10" rx="2" fill="#085041"/>
<text font-size="11" fill="#333" x="125" y="98">Front delt</text>
<rect x="196" y="89" width="10" height="10" rx="2" fill="#085041"/>
<text font-size="11" fill="#333" x="212" y="98">Side delt</text>
<rect x="277" y="89" width="10" height="10" rx="2" fill="#085041"/>
<text font-size="11" fill="#333" x="293" y="98">Rear delt</text>
<rect x="358" y="89" width="10" height="10" rx="2" fill="#633806"/>
<text font-size="11" fill="#333" x="374" y="98">Back</text>
<rect x="412" y="89" width="10" height="10" rx="2" fill="#042c53"/>
<text font-size="11" fill="#333" x="428" y="98">Biceps</text>
<rect x="477" y="89" width="10" height="10" rx="2" fill="#185fa5"/>
<text font-size="11" fill="#333" x="493" y="98">Triceps</text>
<rect x="547" y="89" width="10" height="10" rx="2" fill="#444441"/>
<text font-size="11" fill="#333" x="563" y="98">Abs</text>

<!-- PRE-WORKOUT NOTE -->
<rect x="30" y="122" width="620" height="36" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="139">Before: upper mobility routine, pre half · then 1–2 light warm-up sets</text>
<text font-size="11" fill="#2272a8" x="50" y="152">Outside the exercise time (R19) · use current working loads; new exercises start at the stated RIR</text>

<!-- ── A SUPERSET 1 ── -->
<rect x="30" y="170" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="186">A — Superset 1: Upper back + Chest  (~10 min · 3 rounds · 60–90 s after each pair)</text>

<!-- A1 — Chest-supported row -->
<rect x="30" y="204" width="8" height="54" rx="2" fill="#633806"/>
<rect x="38" y="204" width="612" height="54" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="220">1</text>
<text font-size="12" font-weight="500" fill="#412402" x="72" y="220">Chest-supported dumbbell row (incline bench)</text>
<text font-size="11" fill="#633806" x="72" y="235">Upper back (S) · lats, biceps and rear delt assist</text>
<text font-size="11" fill="#633806" x="72" y="250">Elbows to or just past the torso line · arms together</text>
<text font-size="12" font-weight="500" fill="#412402" x="490" y="220">3 × 10–12</text>
<text font-size="11" fill="#633806" x="490" y="235">3 RIR · wk 5+: 2</text>
<text font-size="11" fill="#633806" x="490" y="249">DB + bench</text>

<text font-size="12" fill="#888" x="340" y="272" text-anchor="middle">↕ then immediately</text>

<!-- A2 — Band crossover -->
<rect x="30" y="282" width="8" height="54" rx="2" fill="#26215c"/>
<rect x="38" y="282" width="612" height="54" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="298">2</text>
<text font-size="12" font-weight="500" fill="#26215c" x="72" y="298">Band crossover (long bands anchored high)</text>
<text font-size="11" fill="#3c3489" x="72" y="313">Chest (S) · start with the arms short of the torso plane</text>
<text font-size="11" fill="#3c3489" x="72" y="328">Hands meet at mid-chest · soft elbow · arms together</text>
<text font-size="12" font-weight="500" fill="#26215c" x="490" y="298">3 × 12–15</text>
<text font-size="11" fill="#3c3489" x="490" y="313">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#3c3489" x="490" y="327">2 long bands + frame</text>

<!-- ── B SUPERSET 2 ── -->
<rect x="30" y="350" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="366">B — Superset 2: Lats + Lower traps  (~10 min · 3 rounds · 60–90 s after each pair)</text>

<!-- B3 — DB pullover -->
<rect x="30" y="384" width="8" height="54" rx="2" fill="#633806"/>
<rect x="38" y="384" width="612" height="54" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="400">3</text>
<text font-size="12" font-weight="500" fill="#412402" x="72" y="400">Dumbbell pullover on the bench</text>
<text font-size="11" fill="#633806" x="72" y="415">Lats (L) · ⚠ free DB overhead: shoulder blades braced (R6)</text>
<text font-size="11" fill="#633806" x="72" y="430">Lower to ~70–80% of shoulder flexion, arms short of the ears</text>
<text font-size="12" font-weight="500" fill="#412402" x="490" y="400">3 × 10–12</text>
<text font-size="11" fill="#633806" x="490" y="415">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#633806" x="490" y="429">DB + bench</text>

<text font-size="12" fill="#888" x="340" y="452" text-anchor="middle">↕ then immediately</text>

<!-- B4 — Prone Y raise -->
<rect x="30" y="462" width="8" height="54" rx="2" fill="#633806"/>
<rect x="38" y="462" width="612" height="54" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="478">4</text>
<text font-size="12" font-weight="500" fill="#412402" x="72" y="478">Prone Y raise (floor, light dumbbells or none)</text>
<text font-size="11" fill="#633806" x="72" y="493">Lower and mid traps (S) · thumbs up, arms in a Y · no shrug (R8)</text>
<text font-size="11" fill="#633806" x="72" y="508">Blades braced, short of end range · shoulder unstable → straight (R9)</text>
<text font-size="12" font-weight="500" fill="#412402" x="490" y="478">3 × 12–15</text>
<text font-size="11" fill="#633806" x="490" y="493">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#633806" x="490" y="507">Floor · light DBs</text>

<!-- ── C SUPERSET 3 ── -->
<rect x="30" y="530" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="546">C — Superset 3: Biceps + Front delt  (~10 min · 3 rounds · 60–90 s after each pair)</text>

<!-- C5 — Hammer curl -->
<rect x="30" y="564" width="8" height="54" rx="2" fill="#042c53"/>
<rect x="38" y="564" width="612" height="54" rx="4" fill="#ddeeff" stroke="#185fa5" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="580">5</text>
<text font-size="12" font-weight="500" fill="#042c53" x="72" y="580">Hammer curl, both arms (neutral grip, standing)</text>
<text font-size="11" fill="#0c447c" x="72" y="595">Biceps and brachialis (M) · soft elbow at the bottom</text>
<text font-size="11" fill="#0c447c" x="72" y="610">Elbows at the sides · both arms together · no swing</text>
<text font-size="12" font-weight="500" fill="#042c53" x="490" y="580">3 × 10–12</text>
<text font-size="11" fill="#0c447c" x="490" y="595">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#0c447c" x="490" y="609">Dumbbells</text>

<text font-size="12" fill="#888" x="340" y="632" text-anchor="middle">↕ then immediately</text>

<!-- C6 — DB front raise -->
<rect x="30" y="642" width="8" height="54" rx="2" fill="#085041"/>
<rect x="38" y="642" width="612" height="54" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="658">6</text>
<text font-size="12" font-weight="500" fill="#085041" x="72" y="658">Dumbbell front raise, both arms</text>
<text font-size="11" fill="#0f6e56" x="72" y="673">Front delt (S) · thumbs up · stop at shoulder height</text>
<text font-size="11" fill="#0f6e56" x="72" y="688">Soft elbow · both arms together · no torso swing</text>
<text font-size="12" font-weight="500" fill="#085041" x="490" y="658">3 × 12–15</text>
<text font-size="11" fill="#0f6e56" x="490" y="673">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#0f6e56" x="490" y="687">Dumbbells</text>

<!-- ── D SUPERSET 4 ── -->
<rect x="30" y="710" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="726">D — Superset 4: Side delt + Abs  (~10.5 min · 3 rounds · 60–90 s after each pair)</text>

<!-- D7 — DB lateral raise -->
<rect x="30" y="744" width="8" height="54" rx="2" fill="#085041"/>
<rect x="38" y="744" width="612" height="54" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="760">7</text>
<text font-size="12" font-weight="500" fill="#085041" x="72" y="760">Dumbbell lateral raise, both arms</text>
<text font-size="11" fill="#0f6e56" x="72" y="775">Side delt (S) · raise to 80°, just below shoulder height</text>
<text font-size="11" fill="#0f6e56" x="72" y="790">Soft elbow · both arms together · no shrug</text>
<text font-size="12" font-weight="500" fill="#085041" x="490" y="760">3 × 12–15</text>
<text font-size="11" fill="#0f6e56" x="490" y="775">2 RIR · wk 5+: 1</text>
<text font-size="11" fill="#0f6e56" x="490" y="789">Dumbbells</text>

<text font-size="12" fill="#888" x="340" y="812" text-anchor="middle">↕ then immediately</text>

<!-- D8 — Dead bug hold -->
<rect x="30" y="822" width="8" height="54" rx="2" fill="#444441"/>
<rect x="38" y="822" width="612" height="54" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="838">8</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="72" y="838">Dead bug hold, both arms and both legs up</text>
<text font-size="11" fill="#5f5e5a" x="72" y="853">Abs (M) · low back flat; arms over shoulders, hips 90°</text>
<text font-size="11" fill="#5f5e5a" x="72" y="868">Progress: straighten both legs only while the back stays flat</text>
<text font-size="12" font-weight="500" fill="#2c2c2a" x="490" y="838">3 × 48–60 s</text>
<text font-size="11" fill="#5f5e5a" x="490" y="853">8 s in reserve · wk 5+: 4</text>
<text font-size="11" fill="#5f5e5a" x="490" y="867">Floor</text>

<!-- POST-WORKOUT NOTE -->
<rect x="30" y="888" width="620" height="49" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="905">After: mobility post half · day after: no archery</text>
<text font-size="11" fill="#2272a8" x="50" y="918">Chest, delts, back, triceps and abs collect sets here — archery's day-before muscles (R21)</text>
<text font-size="11" fill="#2272a8" x="50" y="931">Next day, train only if that morning's step gate passes for every joint both sessions load (R20)</text>

<!-- GLOBAL RULES -->
<rect x="30" y="949" width="620" height="192" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="971">Every rep, every set — hypermobility rules</text>
<rect x="50" y="981" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="989">Lower every rep over 2–3 s; keep a soft bend at every joint, no lockout (R25 · R2)</text>
<rect x="50" y="1001" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1009">Peak effort at ~70–80% of your range, never end range: stage 2 opens full range, not end range (R1 · R3)</text>
<rect x="50" y="1021" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1029">Skip the session if joints feel loose; end a set the moment a joint feels unstable (R9)</text>
<rect x="50" y="1041" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1049">Weeks 1–4: compounds 3 RIR, isolation 2 RIR; from week 5: 2 and 1 (R18) — week 1 = your first session</text>
<rect x="50" y="1061" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1069">Both arms together on every exercise: one-arm work waits for loading stage 3 (R12)</text>
<rect x="50" y="1081" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1089">Holds: end ~8 s before failure (wk 5+: ~4 s); too easy at 60 s → harder variant, not longer (R16)</text>
<rect x="50" y="1101" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1109">Progress: top of the rep range twice → your smallest load step, reps back to the bottom (R42)</text>
<rect x="50" y="1121" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="1129">Log the step gate after each session; a fail repeats last week's dose for that joint (§2.6 · R43)</text>

<!-- TIMING SUMMARY -->
<rect x="30" y="1153" width="620" height="67" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="1173">Session timeline</text>
<text font-size="11" fill="#2272a8" x="50" y="1190">Mobility pre half → warm-up sets → A → B → C → D → mobility post half</text>
<text font-size="11" fill="#2272a8" x="50" y="1207">Exercise time ≈38.5 min (R40: 4 s a rep, top of every range, 90 s after each pair) · 24 working sets</text>

