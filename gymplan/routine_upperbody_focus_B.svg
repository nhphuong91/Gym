<text font-size="10" fill="#444" x="280" y="1450">Cable pullover (M: no L off-bench)</text>
<text font-size="10" fill="#444" x="470" y="1450">Straight-arm band pulldown</text>

<!-- VERSION NOTE -->
<text font-size="9" fill="#aaa" x="340" y="1482" text-anchor="middle">v8 — re-paired: every exercise in a superset, no straight sets (R38 · R39) · lat pulldown 4, pullover 3, biceps 7 · replaces v7</text>

