<text font-size="11" fill="#26215c" x="50" y="1274">Chest 3 · week 10</text>
<text font-size="11" fill="#085041" x="50" y="1292">Front delt 3 · week 7 + 3.5</text>
<text font-size="11" fill="#085041" x="50" y="1310">Side delt 3 · week 10</text>
<text font-size="11" fill="#085041" x="50" y="1328">Rear delt 0 · week 7 + 3</text>
<text font-size="11" fill="#633806" x="50" y="1346">Lats 3 · week 7 + 3</text>
<text font-size="11" fill="#633806" x="360" y="1274">Upper back 6 · week 9 + 2 (1 above, R48)</text>
<text font-size="11" fill="#042c53" x="360" y="1292">Biceps 3 · week 7 + 5</text>
<text font-size="11" fill="#185fa5" x="360" y="1310">Triceps 0 · week 7 + 3.5</text>
<text font-size="11" fill="#444441" x="360" y="1328">Abs 3 · week 10</text>

