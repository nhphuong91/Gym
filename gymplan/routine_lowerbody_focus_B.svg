<text font-size="11" fill="#1a1a1a" x="50" y="1101">Strength · ≈4 a target (R34)</text>
<text font-size="11" fill="#26215c" x="50" y="1119">Quads 2 · week 6 (2 above, R48)</text>
<text font-size="11" fill="#633806" x="50" y="1137">Hamstrings 2 · week 6 (2 above, R48)</text>
<text font-size="11" fill="#185fa5" x="50" y="1155">Calves 2 · week 6 (2 above, R48)</text>
<text font-size="11" fill="#085041" x="50" y="1173">Hip abductors 2 · week 6 (2 above, R48)</text>
<text font-size="11" fill="#085041" x="50" y="1191">Adductors 2 · week 6 (2 above, R48)</text>
<text font-size="11" fill="#085041" x="50" y="1209">Glutes 0 · week 0 + 6.0 from cards 1 and 2 (R36)</text>
<text font-size="11" fill="#1a1a1a" x="360" y="1101">Endurance · ≈4 a target (R34)</text>
<text font-size="11" fill="#444441" x="360" y="1119">Evertors 0 · week 4</text>
<text font-size="11" fill="#444441" x="360" y="1137">Popliteus 0 · week 4</text>
<text font-size="11" fill="#444441" x="360" y="1155">Tibialis 0 · week 4</text>
<text font-size="11" fill="#085041" x="360" y="1173">Hip flexors 0 · week 4</text>

