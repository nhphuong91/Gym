<svg width="100%" viewBox="0 0 680 1425" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">

<text font-size="15" font-weight="500" fill="#1a1a1a" x="340" y="28" text-anchor="middle">Lower body strength — Session B</text>
<text font-size="11" fill="#666" x="340" y="44" text-anchor="middle">Focus block · 10 targets · hip, knee, ankle, spine at loading stage 1 · shoulder 2 · ~37 min · 10 working sets</text>

<!-- LEGEND -->
<rect x="30" y="54" width="620" height="56" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#1a1a1a" x="50" y="72">Muscle group</text>
<rect x="50" y="89" width="10" height="10" rx="2" fill="#26215c"/>
<text font-size="11" fill="#333" x="66" y="98">Quads</text>
<rect x="109" y="89" width="10" height="10" rx="2" fill="#633806"/>
<text font-size="11" fill="#333" x="125" y="98">Hamstrings</text>
<rect x="196" y="89" width="10" height="10" rx="2" fill="#185fa5"/>
<text font-size="11" fill="#333" x="212" y="98">Calves</text>
<rect x="261" y="89" width="10" height="10" rx="2" fill="#085041"/>
<text font-size="11" fill="#333" x="277" y="98">Hips</text>

<!-- PRE-WORKOUT NOTE -->
<rect x="30" y="122" width="620" height="62" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="139">Before: lower mobility routine, pre half · then light warm-up sets before each strength lift</text>
<text font-size="11" fill="#2272a8" x="50" y="152">Outside the exercise time (R19) · strength load: ≈60% in weeks 1–2, ≈80% in weeks 3–4, 100% from week 5 (R22)</text>
<text font-size="11" fill="#2272a8" x="50" y="165">100% = the load that leaves 3 in reserve after 3 reps: reach it from below from week 5, no maximum test (R16)</text>
<text font-size="11" fill="#2272a8" x="50" y="178">Guide: ≈60% is a load you could lift 20+ times, ≈80% about 12–15 times · week 1 = your first session</text>

<!-- ── A STRAIGHT SETS ── -->
<rect x="30" y="196" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="212">A — Straight sets: Quads  (strength · ~10.5 min · 2 sets · 2–5 min rest after each)</text>

<!-- A1 — Smith squat -->
<rect x="30" y="230" width="8" height="70" rx="2" fill="#26215c"/>
<rect x="38" y="230" width="612" height="70" rx="4" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="246">1</text>
<text font-size="12" font-weight="500" fill="#26215c" x="72" y="246">Smith squat, above parallel</text>
<text font-size="11" fill="#3c3489" x="72" y="261">Quads (M) · glutes assist</text>
<text font-size="11" fill="#3c3489" x="72" y="276">Bar on the upper back, wrists straight · soft knee at the top, no lockout</text>
<text font-size="11" fill="#3c3489" x="72" y="290">Safeties at the depth cap: the thighs stay above parallel</text>
<text font-size="12" font-weight="500" fill="#26215c" x="490" y="246">2 × 3</text>
<text font-size="11" fill="#3c3489" x="490" y="261">3 RIR · every week</text>
<text font-size="11" fill="#3c3489" x="490" y="275">Smith · safeties</text>

<!-- ── B STRAIGHT SETS ── -->
<rect x="30" y="314" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="330">B — Straight sets: Hamstrings  (strength · ~10.5 min · 2 sets · 2–5 min rest after each)</text>

<!-- B2 — Smith RDL -->
<rect x="30" y="348" width="8" height="70" rx="2" fill="#633806"/>
<rect x="38" y="348" width="612" height="70" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="364">2</text>
<text font-size="12" font-weight="500" fill="#412402" x="72" y="364">Smith Romanian deadlift</text>
<text font-size="11" fill="#633806" x="72" y="379">Hamstrings (L) · glutes and erectors assist</text>
<text font-size="11" fill="#633806" x="72" y="394">Bar close along the thighs · spine neutral · soft knees and elbows</text>
<text font-size="11" fill="#633806" x="72" y="408">Safeties near mid-shin, at ~70–80% of your range: the bar stops there</text>
<text font-size="12" font-weight="500" fill="#412402" x="490" y="364">2 × 3</text>
<text font-size="11" fill="#633806" x="490" y="379">3 RIR · every week</text>
<text font-size="11" fill="#633806" x="490" y="393">Smith · safeties</text>

<!-- ── C SUPERSET 1 ── -->
<rect x="30" y="432" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="448">C — Superset 1: Calves + Hip abductors  (strength · ~11 min · 2 rounds · 2–5 min rest)</text>

<!-- C3 — Smith calf raise -->
<rect x="30" y="466" width="8" height="70" rx="2" fill="#185fa5"/>
<rect x="38" y="466" width="612" height="70" rx="4" fill="#e6f1fb" stroke="#378add" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="482">3</text>
<text font-size="12" font-weight="500" fill="#042c53" x="72" y="482">Smith standing calf raise</text>
<text font-size="11" fill="#185fa5" x="72" y="497">Calves (L) · bar on the upper back · soft knees</text>
<text font-size="11" fill="#185fa5" x="72" y="512">Optional 3–5 cm heel drop, pause at the bottom · stop short of full height</text>
<text font-size="11" fill="#185fa5" x="72" y="526">Safeties just under the lowest bar position</text>
<text font-size="12" font-weight="500" fill="#042c53" x="490" y="482">2 × 3</text>
<text font-size="11" fill="#185fa5" x="490" y="497">3 RIR · every week</text>
<text font-size="11" fill="#185fa5" x="490" y="511">Smith · optional low step</text>

<text font-size="12" fill="#888" x="340" y="550" text-anchor="middle">↕ then immediately</text>

<!-- C4 — Hip abduction machine -->
<rect x="30" y="560" width="8" height="54" rx="2" fill="#085041"/>
<rect x="38" y="560" width="612" height="54" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="576">4</text>
<text font-size="12" font-weight="500" fill="#085041" x="72" y="576">Hip abduction machine</text>
<text font-size="11" fill="#0f6e56" x="72" y="591">Hip abductors (M) · seated · pads on the thighs above the knees</text>
<text font-size="11" fill="#0f6e56" x="72" y="606">Open to ~70–80% of your range, never end range · both legs together</text>
<text font-size="12" font-weight="500" fill="#085041" x="490" y="576">2 × 3</text>
<text font-size="11" fill="#0f6e56" x="490" y="591">3 RIR · every week</text>
<text font-size="11" fill="#0f6e56" x="490" y="605">Hip machine</text>

<!-- ── D STRAIGHT SETS ── -->
<rect x="30" y="628" width="620" height="24" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="0.5"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="644">D — Straight sets: Adductors  (strength · ~5.5 min · 2 sets · 2–5 min rest after each)</text>

<!-- D5 — Hip adduction machine -->
<rect x="30" y="662" width="8" height="54" rx="2" fill="#085041"/>
<rect x="38" y="662" width="612" height="54" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text font-size="11" font-weight="500" fill="#555" x="54" y="678">5</text>
<text font-size="12" font-weight="500" fill="#085041" x="72" y="678">Hip adduction machine</text>
<text font-size="11" fill="#0f6e56" x="72" y="693">Adductors (M) · seated · pads on the thighs above the knees</text>
<text font-size="11" fill="#0f6e56" x="72" y="708">Start with the legs open to ~70–80% of your range, not end range</text>
<text font-size="12" font-weight="500" fill="#085041" x="490" y="678">2 × 3</text>
<text font-size="11" fill="#0f6e56" x="490" y="693">3 RIR · every week</text>
<text font-size="11" fill="#0f6e56" x="490" y="707">Hip machine</text>

<!-- POST-WORKOUT NOTE -->
<rect x="30" y="728" width="620" height="36" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="745">After: lower mobility routine, post half</text>
<text font-size="11" fill="#2272a8" x="50" y="758">Next day, train only if that morning's step gate passes for every joint both sessions load (R20)</text>

<!-- GLOBAL RULES -->
<rect x="30" y="776" width="620" height="192" rx="6" fill="#f7f7f7" stroke="#ccc" stroke-width="0.8"/>
<text font-size="12" font-weight="500" fill="#1a1a1a" x="50" y="798">Every rep, every set — hypermobility rules</text>
<rect x="50" y="808" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="816">Lower every rep over 2–3 s; keep a soft bend at every joint, no lockout (R25 · R2)</text>
<rect x="50" y="828" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="836">Work to ~70–80% of your range, never end range; the safeties end squat and hinge depth (R1 · R3 · R11)</text>
<rect x="50" y="848" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="856">Skip the session if joints feel loose; end a set the moment a joint feels unstable (R9)</text>
<rect x="50" y="868" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="876">Strength: 3 reps with 3 in reserve, every week — from week 5 a load you could lift 6 times (R17 · R22)</text>
<rect x="50" y="888" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="896">Strength rest: 2–5 min after each set or pair, as the next set needs (Stage 0 §2.2)</text>
<rect x="50" y="908" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="916">Both legs together on every exercise: one-leg work waits for loading stage 3 (R12)</text>
<rect x="50" y="928" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="936">Progress strength from week 5: 3 reps leave over 3 in reserve, twice running → smallest load step (R42)</text>
<rect x="50" y="948" width="7" height="7" rx="1" fill="#e8a020"/>
<text font-size="11" fill="#444" x="64" y="956">Log the step gate after each session; a fail repeats last week's dose for that joint (§2.6 · R43)</text>

<!-- TIMING SUMMARY -->
<rect x="30" y="980" width="620" height="67" rx="8" fill="#e8f4fd" stroke="#5aabf0" stroke-width="1"/>
<text font-size="12" font-weight="500" fill="#1a5c8a" x="50" y="1000">Session timeline</text>
<text font-size="11" fill="#2272a8" x="50" y="1017">Mobility pre half → warm-up sets → A → B → C → D → mobility post half</text>
<text font-size="11" fill="#2272a8" x="50" y="1034">Exercise time ≈37 min (R40: 4 s a rep, 5 min rest, the last rest not counted) · 10 working sets</text>

