<text font-size="10" fill="#444" x="280" y="1329">Deficit calf raise, step edge ⚠ R30</text>
<text font-size="10" fill="#444" x="470" y="1329">Standing calf raise, DBs ⚠ R30</text>

<text font-size="10" fill="#085041" x="50" y="1345">4  Hip abduction machine</text>
<text font-size="10" fill="#444" x="280" y="1345">Supine banded butterfly ⚠ R30</text>
<text font-size="10" fill="#444" x="470" y="1345">none: the others need stage 3</text>

<text font-size="10" fill="#085041" x="50" y="1361">5  Hip adduction machine</text>
